# Force-404 internal markdown even when the file exists in the publish dir.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Fail deployment on technical SEO regressions after the existing build completes.
[[plugins]]
  package = "./.github/netlify-seo-guard"
