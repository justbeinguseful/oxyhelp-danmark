name: SEO regression guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    name: Repository SEO guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public indexing and private exclusions
        run: python3 .github/scripts/seo_guard.py --root . --report "$RUNNER_TEMP/seo-guard.json"

